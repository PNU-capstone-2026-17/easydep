# 도구 설정의 단일 소스 — 단, **검사 범위는 이 저장소 전체가 아니다.**
#
# easydep은 에이전트별 저장소를 하나로 합친 팀 저장소다. 여기 설정은
# `app/requirements/`(요구사항 분석)와 `app/core/cloudkb/`(지식베이스)만 검사한다.
# 나머지 경로는 다른 사람이 관리하므로, 규칙을 걸어 남의 코드를 빨갛게 만들지 않는다.
# 범위를 넓히려면 그 코드 담당자와 합의한 뒤 아래 include/files에 추가한다.
#
# 패키징 테이블([project]/[build-system])은 두지 않는다. 설치 경로는
# requirements.txt 그대로이고 Dockerfile·bootstrap 스크립트·k8s 이미지가 그 경로를
# 쓴다. pytest 설정도 저장소 공용이라 루트 pytest.ini에 그대로 둔다.

[tool.ruff]
target-version = "py311"          # README의 최소 지원 버전
line-length = 100
# 검사 대상. 여기 없는 경로는 `ruff check .` 를 돌려도 건드리지 않는다.
include = [
    "app/requirements/**/*.py",
    "app/core/cloudkb/**/*.py",
    # 두 에이전트가 공유하는 얇은 층. 둘 다 내 범위라 여기도 같이 검사한다.
    "app/core/**/*.py",
]
extend-exclude = [
    "app/core/cloudkb/.cache",
]

[tool.ruff.lint]
# 켜 놓은 규칙은 위 범위에서 위반 0이다. 규칙을 켜고 위반을 남겨두면 게이트가
# 경고로 전락하므로, 아직 못 고친 것은 아래 ignore에 개수와 함께 적어 둔다.
select = [
    "F",      # pyflakes — 미정의 이름·미사용 임포트 등 진짜 오류
    "E4",     # 임포트 형식
    "E7",     # 문장 형식
    "E9",     # 구문·IO 오류
    "W",      # pycodestyle 경고
    "I",      # isort — 임포트 정렬
    "UP",     # pyupgrade — 낡은 문법
    "C4",     # comprehension
    "PIE",    # 불필요한 코드
    "SIM",    # 단순화
    "RUF",    # ruff 고유 규칙
    "FURB",   # 현대화
    "DTZ",    # timezone-naive datetime
    "PLW",    # pylint warning
    "TRY",    # 예외 처리 관용구
    "ISC",    # 암묵적 문자열 연결
    "S",      # bandit — 보안
    "BLE",    # blind except
]
ignore = [
    # E501(줄 길이): 주석이 한국어라 ruff의 문자 폭 계산에서 120자로 잡아도 100건이
    # 넘게 걸린다. 길이는 포매터가 다룰 문제라 게이트에서 뺀다.
    "E501",
    # RUF001~003(모호한 유니코드): 주석·문자열이 한국어라 전각 문장부호가 정상이다.
    # 전부 오탐이므로 영구히 끈다.
    "RUF001",
    "RUF002",
    "RUF003",
    # 아래는 "고쳐야 하지만 지금 이 커밋에서 고치지 않는" 것들이다. 숫자는 도입
    # 시점(2026-07-26) 실측이고, 줄이면서 하나씩 지운다.
    "BLE001",  # 31건 — 광범위 except. 에러 모델을 정하고 나서 한꺼번에 좁힌다.
    # RUF100은 BLE001과 한 쌍이다. app/core/cloudkb/ 는 이미 BLE001을 켜고 의도적인
    # 광범위 catch에 `# noqa: BLE001`을 30곳 달아 뒀는데, 위에서 BLE001을 끄면 그
    # 주석들이 "쓸모없는 noqa"로 잡힌다. 둘은 같이 다시 켠다.
    "RUF100",
    "S101",    # assert — 테스트와 도구 코드가 쓴다
    "TRY003",  # 예외 메시지 인라인 — 관용구 변경이라 별도 커밋
    "TRY300",  # else 블록 권고 — 동상
    "TRY301",  # abstract-raise — 동상
    "TRY400",  # logging.exception 권고 — 로깅 도입과 함께
    "SIM105",  # contextlib.suppress — 동상
    "S110",    # 4건 — try-except-pass. BLE001과 같이 정리한다.
    "S112",    # 12건 — try-except-continue. 동상.
    "S310",    # URL 스킴 검증 — 지식베이스 fetch가 고정 URL만 쓴다
    "S603",    # subprocess 호출 — 외부 도구 실행에 필요
    "S607",    # 부분 실행 경로 — 동상
    "SIM115",  # 5건 — 컨텍스트 매니저 없는 open. 호출부 수명이 얽혀 있어 개별 검토.
    "ISC001",  # 포매터와 충돌
    #
    # --- 여기부터는 자동 수정이 안 되거나 판단이 필요해 남겨 둔 것 ---
    # 지금 한꺼번에 고치면 변경이 100개 파일로 번지므로, 개수를 적어 두고 손볼 때
    # 한 규칙씩 지운다. 숫자가 늘면 그건 새로 들어온 빚이다.
    "ISC004",  # 26건 — 컬렉션 리터럴 안 암묵적 문자열 연결. 오탐이 섞여 개별 확인 필요
    "E402",    # 15건 — 임포트가 파일 상단이 아님. conftest의 환경변수 선주입 등 의도적인 것 포함
    "RUF005",  # 9건 — 리스트 연결 대신 언패킹 권고
    "PLW0603", # 6건 — global 문. lru_cache/모듈 캐시 초기화에 쓰인다
    "PLW2901", # 6건 — 루프 변수 재할당
    "RUF059",  # 5건 — 언패킹했지만 안 쓰는 변수(`records, stats = ...`)
    "E741",    # 4건 — 모호한 변수명(l, I, O)
    "S506",    # 4건 — yaml.load. 벤더 CRD를 디스크에서 읽는 자리라 SafeLoader로 바꿔야 한다
    "SIM102",  # 4건 — 중첩 if 합치기
    "F403",    # 2건 — `import *`. step1_requirements가 schemas를 통째로 가져온다
    "F405",    # 3건 — 위 `import *`에서 온 이름
    "E702",    # 2건 — 세미콜론으로 붙인 문장
    "FURB171", # 2건 — 원소 하나짜리 멤버십 검사
    "S324",    # 2건 — 취약한 해시. 캐시 키 용도라 보안 목적이 아님을 확인하고 지울 것
    "C408",    # 1건
    "C416",    # 1건
    "DTZ011",  # 1건 — date.today()
    "ISC002",  # 1건
    "PIE810",  # 1건
    "S314",    # 1건 — xml.etree 파싱
    "S605",    # 1건 — 셸로 프로세스 실행
    "SIM110",  # 1건 — any()로 대체 가능한 루프
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 픽스처 이름 재사용·긴 리터럴이 정상이다.
"app/core/cloudkb/tests/**" = ["S105", "S106", "S108"]
# 랜덤은 예시 샘플링용이지 암호용이 아니다.
"app/requirements/legacy/example_sampler.py" = ["S311"]

[tool.ruff.format]
# 아직 저장소에 돌리지 않았다. 전면 포맷은 진행 중인 브랜치와 충돌하므로 별도
# 커밋으로 분리한다. 설정만 먼저 고정해 둔다.
quote-style = "double"

[tool.mypy]
python_version = "3.13"          # Dockerfile·로컬 venv가 쓰는 버전
# ruff와 달리 mypy는 파일을 하나씩 올린다. 계약이 오가는 이음매 — 스키마·설정·
# 지식베이스 공통 모델 — 부터 켜고, 초록인 모듈을 하나씩 추가하며 넓힌다.
#
# 지금 뺀 것:
#  - app/core/cloudkb/capacitykb/model/records.py: 데이터클래스 필드 이름이
#    `property`라 클래스 본문에서 빌트인 `property`를 가린다. 런타임에는 애너테이션만
#    있어 문제가 없지만 mypy는 오류로 본다. 필드 이름을 바꾸면 schema.json과 질의까지
#    번지므로 그 리네이밍을 할 때 같이 켠다.
files = [
    # 에이전트 사이의 문. 여기가 틀리면 `RESOURCE_SPEC` 계약이 통째로 틀린다.
    "app/core",
    # 공통 기반 계층. 다른 에이전트가 쓸 코드라 여기부터 타입을 지킨다.
    "app/requirements/common",
    "app/requirements/schemas.py",
    "app/requirements/config.py",
    "app/requirements/agent/state.py",
    # 파이프라인 모양의 단일 소스. 여기가 틀리면 배선이 통째로 틀린다.
    "app/requirements/agent/stages.py",
    # 규칙 지식베이스. 순수 데이터·순수 함수라 타입이 전부 지켜지고, 프롬프트·검출기·
    # 리포트가 전부 여기서 파생되므로 여기가 틀리면 근거가 통째로 틀린다.
    "app/requirements/knowledge",
    # 평가. 채점이 틀리면 "나아졌다"는 판단이 통째로 틀린다.
    "app/requirements/evaluation",
    # 체크포인터. 상위 인터페이스와 시그니처가 어긋나면 재개가 조용히 깨진다.
    "app/requirements/session_store.py",
    "app/core/cloudkb/kbcommon",
    "app/core/cloudkb/graphkb/model",
    "app/core/cloudkb/sizingkb/model.py",
    "app/core/cloudkb/bundlekb/model.py",
    "app/core/cloudkb/patternkb/model.py",
]
ignore_missing_imports = true    # 벤더 SDK 상당수가 스텁을 내놓지 않는다
follow_imports = "silent"        # files 밖 모듈은 해석만 하고 검사하지 않는다
