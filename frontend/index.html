<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture Artifact Workflow</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #eef2f6;
      --text: #17202a;
      --muted: #667085;
      --line: #d7dee8;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --ok: #15803d;
      --warn: #b45309;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 14px;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.ok {
      background: var(--ok);
    }

    main {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--panel-soft);
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }

    .panel-body {
      padding: 14px;
    }

    .steps {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .step {
      width: 100%;
      height: 42px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      text-align: left;
      cursor: pointer;
    }

    .step[disabled] {
      color: var(--muted);
      cursor: not-allowed;
      background: #f8fafc;
    }

    .step.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .step-index {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .step.done .step-index {
      background: var(--ok);
      color: #fff;
    }

    .badge {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    select {
      padding: 8px 6px;
    }

    /* 되감기 영향 범위 안내 */
    .impact {
      margin: 8px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfbfc;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }

    .impact.hidden { display: none; }
    .impact strong { color: var(--text); }
    .impact ul { margin: 4px 0 8px; padding-left: 18px; }
    .impact li { word-break: break-all; }

    .impact .warn {
      display: block;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      color: #b45309;
    }

    .field.hidden { display: none; }

    textarea:focus,
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      min-height: 180px;
      padding: 10px;
      resize: vertical;
      line-height: 1.5;
    }

    input {
      height: 36px;
      padding: 0 10px;
    }

    .field {
      margin-bottom: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      height: 36px;
      border: 0;
      border-radius: 6px;
      padding: 0 13px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button.secondary:hover {
      background: #d1d5db;
    }

    button[disabled] {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    .output-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fff;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 17px;
    }

    .diagram-image-wrap {
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
      text-align: center;
      padding: 16px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .diagram-image-wrap.hidden {
      display: none;
    }

    .diagram-image-wrap img {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: zoom-in;
      transition: opacity 0.15s;
    }

    .diagram-image-wrap img:hover {
      opacity: 0.85;
    }

    .diagram-image-wrap .no-image {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    /* ── Lightbox modal ── */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    .lightbox-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 10000;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.3);
    }

    pre {
      min-height: 300px;
      margin: 0;
      padding: 16px;
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .errors {
      min-height: 72px;
      max-height: 160px;
      overflow: auto;
      margin: 0;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: #fff7ed;
      color: var(--danger);
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .errors.empty {
      background: #f0fdf4;
      color: var(--ok);
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      .output-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Architecture Artifact Workflow</h1>
    <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">대기 중</span></div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">Workflow</div>
      <div class="panel-body">
        <div id="steps" class="steps"></div>

        <div class="field">
          <label for="appIdInput">App ID — 요구사항 분석에서 이어받습니다</label>
          <input id="appIdInput" placeholder="요구사항 분석을 먼저 진행하세요" spellcheck="false" readonly>
        </div>

        <div class="field">
          <label for="usecaseSpecText">유스케이스 명세 (USECASE_SPEC) — 요구사항 분석에서 이어받습니다</label>
          <textarea id="usecaseSpecText" spellcheck="false" readonly placeholder="요구사항 분석 단계에서 유스케이스 명세를 먼저 생성하세요."></textarea>
        </div>

        <div class="field">
          <label for="feedbackText">현재 산출물 피드백 — 비워두고 [다음 단계]를 누르면 그대로 진행합니다</label>
          <textarea id="feedbackText" spellcheck="false" placeholder="예) 주문 클래스에 주문일시 필드를 추가해줘"></textarea>
        </div>

        <div class="actions">
          <button id="generateButton" type="button">설계 시작</button>
          <button id="feedbackButton" type="button" class="secondary">피드백 반영</button>
          <button id="nextButton" type="button" class="secondary">다음 단계</button>
        </div>

        <!-- 버튼이 왜 안 눌리는지 말해준다. 막혀 있는데 이유가 없으면 고장으로 보인다. -->
        <div id="stateHint" class="impact hidden"></div>

        <!-- 완성된 설계를 고치는 길. 무엇을 어떻게 고칠지 함께 받는다 —
             고른 항목과 추적표가 알려준 하류 항목만 바뀌고 나머지는 그대로다. -->
        <div class="field hidden" id="changeCard">
          <label for="changeTarget">수정할 대상 — 고르면 함께 바뀔 것을 알려줍니다</label>
          <select id="changeTarget"></select>
          <div id="changeImpact" class="impact hidden"></div>
          <label for="changeFeedback" id="changeFeedbackLabel" class="hidden">
            어떻게 고칠까요
          </label>
          <textarea id="changeFeedback" class="hidden" spellcheck="false"
                    placeholder="예) 주문일시 필드를 추가해줘"></textarea>
          <button id="reviseButton" type="button" class="secondary" disabled>
            수정하기
          </button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span id="artifactTitle">Class Diagram</span>
        <span id="artifactBadge" class="badge">locked</span>
      </div>
      <div class="output-meta">
        <div class="metric"><span>STEP</span><strong id="stepMetric">1 / 5</strong></div>
        <div class="metric"><span>VALIDATION</span><strong id="validMetric">N/A</strong></div>
        <div class="metric"><span>COMPLETED</span><strong id="doneMetric">0</strong></div>
      </div>
      <div id="diagramImageWrap" class="diagram-image-wrap">
        <span class="no-image">이미지가 아직 생성되지 않았습니다</span>
      </div>
      <pre id="artifactOutput"></pre>
      <pre id="errorOutput" class="errors empty"></pre>
    </section>
  </main>

  <!-- Lightbox modal -->
  <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="fullscreen diagram" onclick="event.stopPropagation()">
  </div>

  <script>
    const stages = [
      { id: "class_diagram", label: "Class Diagram", artifact: "class_diagram" },
      { id: "sequence_diagram", label: "Sequence Diagram", artifact: "sequence_diagram" },
      { id: "api_spec", label: "API Specification", artifact: "api_spec" },
      { id: "erd", label: "ERD", artifact: "erd" },
      { id: "deployment_diagram", label: "Deployment Diagram", artifact: "deployment_diagram" }
    ];

    // Stages that render to a diagram image. Images are rebuilt on the server
    // from the PlantUML text stored in MySQL, so they are fetched per app id.
    const imageStages = {
      class_diagram: true,
      sequence_diagram: true,
      api_spec: false,
      erd: true,
      deployment_diagram: true
    };

    // 요구사항 분석 UI(app/requirements/static/index.html)와 공유하는 키.
    // 두 화면이 같은 오리진에서 서빙되므로 이 하나로 같은 앱을 가리킨다.
    const APP_ID_KEY = "easydep_app_id";

    // The server owns the workflow state; the browser only keeps the app id
    // plus the last response it rendered.
    //
    // 두 인덱스를 구별한다:
    //   currentIndex — 파이프라인이 실제로 멈춰 있는 단계. **서버가 정한다.**
    //   viewIndex    — 사용자가 지금 보고 있는 단계. 단계 버튼을 누르면 바뀐다.
    // 지난 단계를 눌러 내용을 확인해도 파이프라인은 제자리에 있다 — 보기는 읽기 전용이다.
    const workflow = {
      appId: localStorage.getItem(APP_ID_KEY) || "",
      currentIndex: 0,
      viewIndex: 0,
      artifacts: {},
      validation: {},
      completed: new Set(),
      sessionActive: false,
      finished: false,
      // 추적표가 계산해 준 "이걸 고치면 무엇이 영향받고 어디로 되감아야 하나".
      // 서버가 만든다 — 브라우저가 순회를 다시 구현하면 서버와 어긋날 수 있고,
      // 어긋난 쪽이 사용자에게 보이는 쪽이다.
      changePlan: []
    };

    const stepsEl = document.getElementById("steps");
    const usecaseSpecText = document.getElementById("usecaseSpecText");
    const feedbackText = document.getElementById("feedbackText");
    const generateButton = document.getElementById("generateButton");
    const feedbackButton = document.getElementById("feedbackButton");
    const nextButton = document.getElementById("nextButton");
    const artifactTitle = document.getElementById("artifactTitle");
    const artifactBadge = document.getElementById("artifactBadge");
    const artifactOutput = document.getElementById("artifactOutput");
    const errorOutput = document.getElementById("errorOutput");
    const diagramImageWrap = document.getElementById("diagramImageWrap");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const stepMetric = document.getElementById("stepMetric");
    const validMetric = document.getElementById("validMetric");
    const doneMetric = document.getElementById("doneMetric");
    const appIdInput = document.getElementById("appIdInput");
    const stateHint = document.getElementById("stateHint");
    const changeCard = document.getElementById("changeCard");
    const changeTarget = document.getElementById("changeTarget");
    const changeImpact = document.getElementById("changeImpact");
    const changeFeedback = document.getElementById("changeFeedback");
    const changeFeedbackLabel = document.getElementById("changeFeedbackLabel");
    const reviseButton = document.getElementById("reviseButton");

    appIdInput.value = workflow.appId;

    generateButton.addEventListener("click", () => startDesign());
    feedbackButton.addEventListener("click", () => resumeDesign(feedbackText.value));
    nextButton.addEventListener("click", () => resumeDesign(""));
    changeTarget.addEventListener("change", () => renderChangeImpact());
    reviseButton.addEventListener("click", () => applySelectedChange());

    // 보고 있는 단계. 파이프라인 위치(currentStage)와 다를 수 있다.
    function viewedStage() {
      return stages[workflow.viewIndex];
    }

    function currentStage() {
      return stages[workflow.currentIndex];
    }

    function stageIndex(stageId) {
      const index = stages.findIndex((s) => s.id === stageId);
      return index === -1 ? 0 : index;
    }

    // 볼 수 있는 단계 = 이미 만들어진 단계, 그리고 지금 진행 중인 단계.
    function isViewable(index) {
      return workflow.completed.has(stages[index].id) || index === workflow.currentIndex;
    }

    function isCompleted(stageId) {
      return workflow.completed.has(stageId);
    }

    // App ID 는 요구사항 분석 화면이 발급해 localStorage 로 넘겨준다. 이 화면에서
    // 따로 만들거나 바꾸지 않는다 — 설계는 유스케이스 명세 없이는 시작조차 못 하므로,
    // 여기서 만든 빈 앱은 아무 쓸모가 없다.
    //
    // Returns whether the app was actually loaded. The caller must not claim a
    // switch it did not get: on failure workflow.appId still points at the old
    // app, because only applyResponse moves it.
    async function loadApp(appId) {
      if (!appId) {
        showError(new Error("요구사항 분석을 먼저 진행하세요. App ID가 그때 발급됩니다."));
        render();
        return false;
      }

      setBusy("산출물 조회 중");
      try {
        // 산출물은 공용 저장소가, 진행 상황은 설계가 안다 — 저장소는 "어디까지 왔나"를
        // 모르기 때문에 두 번 물어본다.
        const stored = await request(`/api/apps/${appId}`);
        const { session } = await request(`/api/apps/${appId}/design/session`);
        applyResponse({ ...stored, session });
        await refreshChangePlan();
        setStatus("조회 완료", true);
        return true;
      } catch (error) {
        showError(error);
        return false;
      } finally {
        render();
      }
    }

    // ── 파이프라인 구동 ────────────────────────────────────────────────────
    // 서버를 부르고, 응답이 말해주는 단계로 화면을 맞춘다. 브라우저는 "지금 몇 번째인지"를
    // 스스로 정하지 않는다 — 서버가 알고 있다.

    async function drive(path, body, busyMessage) {
      if (!workflow.appId) {
        showError(new Error("요구사항 분석을 먼저 진행하세요. App ID가 그때 발급됩니다."));
        render();
        return;
      }

      setBusy(busyMessage);
      try {
        applyResponse(await request(`/api/apps/${workflow.appId}${path}`, {
          method: "POST",
          body: JSON.stringify(body)
        }));
        setStatus(workflow.finished ? "설계 완료" : "완료", true);
        // 산출물이 바뀌었으니 영향 범위도 바뀐다 — 다시 계산해 온다.
        await refreshChangePlan();
      } catch (error) {
        showError(error);
      } finally {
        render();
      }
    }

    // 설계 시작. 아직 한 번도 안 돌린 앱에서만 누를 수 있다(render 가 그렇게 막는다).
    function startDesign() {
      feedbackText.value = "";
      return drive("/design/start", {},
        "설계 시작: 클래스 다이어그램 생성까지 30초 이상 걸릴 수 있습니다");
    }

    // 게이트에 답한다. 빈 피드백이면 다음 단계로, 아니면 이 단계를 다시 만든다.
    function resumeDesign(feedback) {
      const text = (feedback || "").trim();
      return drive("/design/resume", { feedback: text },
        text ? "피드백 반영 중: 모델을 수정하고 다시 렌더합니다"
             : "다음 단계 생성 중: LLM 응답까지 30초 이상 걸릴 수 있습니다"
      ).then(() => { if (text) feedbackText.value = ""; });
    }

    // 지난 단계 보기. **서버를 부르지 않는다** — 이미 받아둔 산출물을 보여줄 뿐이고,
    // 파이프라인 위치는 그대로다.
    function viewStage(index) {
      workflow.viewIndex = index;
      render();
    }

    // 클래스·유스케이스 이름은 LLM 이 만든 문자열이다. 그대로 innerHTML 에 넣으면
    // 태그가 될 수 있으므로 중화한다.
    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    const escapeAttr = escapeHtml;

    // ── 수정 대상 → 되감을 지점 ───────────────────────────────────────────
    // 사용자는 "Order 클래스를 고치고 싶다"를 안다. "api_spec 단계로 되감아야 한다"는
    // 추적표가 계산한다. 여기서는 그 계산 결과를 보여주고 확인을 받을 뿐이다.

    async function refreshChangePlan() {
      if (!workflow.appId) {
        workflow.changePlan = [];
        return;
      }
      try {
        const trace = await request(`/api/apps/${workflow.appId}/design/trace`);
        workflow.changePlan = trace.change_plan || [];
      } catch (_) {
        // 추적표를 못 읽어도 본 흐름은 계속되어야 한다 — 수정 대상 고르기만 사라진다.
        workflow.changePlan = [];
      }
      renderChangeTargets();
    }

    function selectedChange() {
      return workflow.changePlan.find((item) => item.ref === changeTarget.value) || null;
    }

    function renderChangeTargets() {
      const keep = changeTarget.value;
      let html = '<option value="">— 선택 —</option>';
      // 스테이지별로 묶는다. change_plan 은 이미 파이프라인 순서로 정렬돼 온다.
      for (const stage of stages) {
        const items = workflow.changePlan.filter((i) => i.stage === stage.id);
        if (!items.length) continue;
        html += `<optgroup label="${escapeAttr(stage.label)}">`;
        for (const item of items) {
          html += `<option value="${escapeAttr(item.ref)}">${escapeHtml(item.element)}</option>`;
        }
        html += "</optgroup>";
      }
      changeTarget.innerHTML = html;
      // 파이프라인이 움직여도 고르던 대상은 유지한다.
      if (workflow.changePlan.some((i) => i.ref === keep)) changeTarget.value = keep;
      renderChangeImpact();
    }

    function renderChangeImpact() {
      const item = selectedChange();
      const chosen = Boolean(item);

      changeImpact.classList.toggle("hidden", !chosen);
      changeFeedback.classList.toggle("hidden", !chosen);
      changeFeedbackLabel.classList.toggle("hidden", !chosen);
      reviseButton.disabled = !chosen;
      if (!chosen) return;

      const list = item.affects.length
        ? `<ul>${item.affects.map((a) => `<li>${escapeHtml(a)}</li>`).join("")}</ul>`
        : "";
      changeImpact.innerHTML = item.affects.length
        ? `<strong>${escapeHtml(item.element)}</strong> 를 고치면 `
          + `<strong>${item.affects.length}개</strong>가 함께 바뀝니다.${list}`
          + `<span class="warn">여기 적힌 것 외에는 <strong>글자 하나 안 바뀝니다.</strong> `
          + `대상이 아닌 항목은 원본을 그대로 씁니다.</span>`
        : `<strong>${escapeHtml(item.element)}</strong> 는 다른 산출물이 참조하지 않습니다. `
          + `이것만 바뀝니다.`;
    }

    // 지목 수정. 되감기(스테이지 통째로 재생성)와 다르다 — 고른 항목과 추적표가
    // 알려준 하류 항목만 바뀐다.
    function applySelectedChange() {
      const item = selectedChange();
      const instruction = changeFeedback.value.trim();
      if (!item) return;
      if (!instruction) {
        showError(new Error("어떻게 고칠지 적어주세요."));
        render();
        return;
      }

      return drive("/design/revise", { target: item.ref, feedback: instruction },
        `${item.element} 수정 중: 영향받는 항목까지 함께 고칩니다`
      ).then(() => { changeFeedback.value = ""; });
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(extractErrorMessage(data));
      }
      return data;
    }

    function applyResponse(data) {
      if (data.app_id) {
        workflow.appId = data.app_id;
        appIdInput.value = data.app_id;
        localStorage.setItem(APP_ID_KEY, data.app_id);
      }
      workflow.artifacts = data.artifacts || {};
      workflow.validation = data.validation || {};
      workflow.completed = new Set();
      stages.forEach((stage) => updateCompletion(stage.id));
      syncUsecaseSpecField();

      // 파이프라인 위치는 서버가 정한다. 실행 응답에는 status/stage가 오고,
      // 단순 조회(GET /api/apps/{id})에는 session이 온다.
      if (data.status === "need_feedback") {
        workflow.sessionActive = true;
        workflow.finished = false;
        workflow.currentIndex = stageIndex(data.stage);
      } else if (data.status === "completed") {
        workflow.sessionActive = false;
        workflow.finished = true;
        workflow.currentIndex = stages.length - 1;
      } else if (data.session) {
        workflow.sessionActive = Boolean(data.session.active);
        // 돌긴 돌았는데 멈춘 곳이 없다 = 끝까지 갔다.
        workflow.finished = Boolean(data.session.exists) && !data.session.active;
        workflow.currentIndex = data.session.stage
          ? stageIndex(data.session.stage)
          : lastCompletedIndex();
      }

      // 파이프라인이 움직이면 보는 화면도 따라간다 — 새 산출물이 나왔는데 옛 단계를
      // 보고 있으면 답답하다. 지난 단계를 **직접 눌러서** 볼 때만 시선이 머문다.
      workflow.viewIndex = workflow.currentIndex;
    }

    function lastCompletedIndex() {
      for (let i = stages.length - 1; i >= 0; i -= 1) {
        if (workflow.completed.has(stages[i].id)) return i;
      }
      return 0;
    }

    // 유스케이스 명세 칸(읽기 전용)을 이 app_id에 저장된 USECASE_SPEC으로 채운다.
    // 요구사항 분석 에이전트가 같은 app_id로 저장해 둔 명세를 설계 화면이 그대로
    // 이어받아 보여준다. 저장된 명세가 없으면 비워 두고 placeholder 안내를 노출한다.
    function syncUsecaseSpecField() {
      const spec = workflow.artifacts.usecase_spec;
      const hasSpec = spec && typeof spec === "object" && Object.keys(spec).length > 0;
      usecaseSpecText.value = hasSpec ? JSON.stringify(spec, null, 2) : "";
    }

    function showError(error) {
      setStatus("오류", false);
      errorOutput.classList.remove("empty");
      errorOutput.textContent = error.message;
    }

    function updateCompletion(stageId) {
      if (hasArtifact(stageId) && getValidation(stageId).valid !== false) {
        workflow.completed.add(stageId);
      }
    }

    function getValidation(stageId) {
      return workflow.validation[stageId] || { valid: undefined, errors: [] };
    }

    function render() {
      renderSteps();
      renderArtifact();
      // 설계 시작은 **아직 한 번도 안 돌렸을 때만.** 이미 돌고 있는 세션을 처음부터
      // 다시 돌리는 버튼은 두지 않는다 — 실수로 누르면 진행 상황이 통째로 날아간다.
      const notStarted = !workflow.sessionActive && !workflow.finished;
      generateButton.disabled = !notStarted || !workflow.appId;
      // 피드백·다음은 게이트에서 멈춰 있을 때, 그리고 **그 단계를 보고 있을 때만**.
      const atGate = workflow.sessionActive && workflow.viewIndex === workflow.currentIndex;
      feedbackButton.disabled = !atGate;
      nextButton.disabled = !atGate;
      nextButton.textContent = workflow.currentIndex >= stages.length - 1
        ? "완료하기" : "다음 단계";
      // 수정 대상 고르기는 한 번이라도 돌린 뒤에만 의미가 있다.
      changeCard.classList.toggle("hidden", !workflow.changePlan.length);
      renderStateHint();
    }

    // 버튼이 안 눌릴 때 그 이유와 다음 행동을 말해준다.
    function renderStateHint() {
      let message = "";
      if (!workflow.appId) {
        message = "App ID 가 없습니다. <strong>요구사항 분석을 먼저 진행하세요</strong> — "
                + "분석을 시작할 때 발급되고, 이 화면이 그대로 이어받습니다.";
      } else if (workflow.finished) {
        message = "이 앱은 설계가 <strong>이미 완료</strong>되어 있습니다. "
                + "고칠 것이 있으면 아래 <strong>[수정할 대상]</strong>에서 고르세요 — "
                + "어느 단계부터 다시 만들어야 하는지 계산해 줍니다.<br>"
                + "새 프로젝트로 시작하려면 요구사항 분석 화면에서 "
                + "<strong>[새 App ID 발급]</strong>을 먼저 누르세요.";
      }
      stateHint.innerHTML = message;
      stateHint.classList.toggle("hidden", !message);
    }

    function renderSteps() {
      stepsEl.innerHTML = "";
      stages.forEach((stage, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "step";
        button.disabled = !isViewable(index);
        button.classList.toggle("active", index === workflow.viewIndex);
        button.classList.toggle("done", isCompleted(stage.id));
        const state = index === workflow.currentIndex && workflow.sessionActive ? "진행 중"
          : isCompleted(stage.id) ? "done" : "locked";
        button.innerHTML = `
          <span class="step-index">${isCompleted(stage.id) ? "✓" : index + 1}</span>
          <span>${stage.label}</span>
          <span class="badge">${state}</span>
        `;
        // 단계 클릭 = **보기**. 서버를 부르지 않고 파이프라인도 안 움직인다.
        if (isViewable(index)) {
          button.title = `${stage.label} 내용 보기`;
          button.addEventListener("click", () => viewStage(index));
        }
        stepsEl.appendChild(button);
      });
    }

    function renderArtifact() {
      // **보고 있는** 단계를 그린다. 파이프라인이 멈춰 있는 단계와 다를 수 있다.
      const stage = viewedStage();
      const isCurrent = workflow.viewIndex === workflow.currentIndex;
      const validation = getValidation(stage.id);
      const value = workflow.artifacts[stage.id];
      const output = stage.id === "api_spec"
        ? JSON.stringify(value || {}, null, 2)
        : value || "";

      artifactTitle.textContent = stage.label
        + (isCurrent ? "" : "  (지난 단계 — 보기 전용)");
      artifactOutput.textContent = output || "아직 생성된 산출물이 없습니다.";
      artifactBadge.textContent = !isCurrent ? "보기"
        : workflow.finished ? "완료"
        : workflow.sessionActive ? "확인 대기"
        : isCompleted(stage.id) ? "done" : "locked";
      stepMetric.textContent = `${workflow.viewIndex + 1} / ${stages.length}`;
      validMetric.textContent = validation.valid === true ? "OK" : validation.valid === false ? "FAIL" : "N/A";
      doneMetric.textContent = String(workflow.completed.size);

      const errors = validation.errors || [];
      errorOutput.classList.toggle("empty", errors.length === 0);
      errorOutput.textContent = errors.length ? errors.join("\n\n") : "검증 오류 없음";

      renderDiagramImage(stage.id);
    }

    function renderDiagramImage(stageId) {
      if (!imageStages[stageId]) {
        diagramImageWrap.classList.add("hidden");
        return;
      }

      diagramImageWrap.classList.remove("hidden");

      if (hasArtifact(stageId) && workflow.appId) {
        const cacheBust = Date.now();
        const base = `/api/apps/${workflow.appId}/stages/${stageId}/image`;
        const pngSrc = `${base}.png?t=${cacheBust}`;
        const svgSrc = `${base}.svg?t=${cacheBust}`;
        diagramImageWrap.innerHTML = `<img src="${pngSrc}" alt="${stageId} diagram" title="클릭하여 전체화면으로 보기" onclick="openLightbox('${svgSrc}', '${pngSrc}')" onerror="this.parentElement.innerHTML='<span class=no-image>이미지 파일을 불러올 수 없습니다</span>'">`;
      } else {
        diagramImageWrap.innerHTML = '<span class="no-image">이미지가 아직 생성되지 않았습니다</span>';
      }
    }

    function hasArtifact(stageId) {
      const value = workflow.artifacts[stageId];
      if (stageId === "api_spec") {
        return Boolean(value && Object.keys(value).length > 0);
      }
      return Boolean(value);
    }

    function setBusy(text) {
      statusDot.classList.remove("ok");
      statusText.textContent = text;
      generateButton.disabled = true;
      feedbackButton.disabled = true;
      nextButton.disabled = true;
    }

    function setStatus(text, ok) {
      statusText.textContent = text;
      statusDot.classList.toggle("ok", ok);
    }

    function extractErrorMessage(data) {
      if (!data) return "요청 실패";
      if (typeof data.detail === "string") return data.detail;
      if (data.detail && data.detail.message) return data.detail.message;
      return JSON.stringify(data.detail || data);
    }

    // ── Lightbox ──
    const lightboxOverlay = document.getElementById("lightboxOverlay");
    const lightboxImg = document.getElementById("lightboxImg");

    function openLightbox(svgSrc, pngFallback) {
      lightboxImg.onerror = function () {
        // SVG failed → try PNG
        if (pngFallback && this.src !== pngFallback) {
          this.src = pngFallback;
        }
      };
      lightboxImg.src = svgSrc;
      lightboxOverlay.classList.add("open");
    }

    function closeLightbox() {
      lightboxOverlay.classList.remove("open");
      lightboxImg.src = "";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    // 요구사항 분석 화면이 다른 탭에서 App ID를 발급/변경하면 이어받는다.
    // (storage 이벤트는 이 탭이 아닌 다른 탭의 변경에만 발생한다.)
    window.addEventListener("storage", async (event) => {
      if (event.key !== APP_ID_KEY) return;
      if (!event.newValue || event.newValue === workflow.appId) return;
      if (await loadApp(event.newValue)) {
        setStatus("요구사항 분석에서 넘어온 App ID로 전환했습니다", true);
      }
    });

    render();

    // Restore the last session's artifacts straight from the database.
    if (workflow.appId) {
      loadApp(workflow.appId);
    }
  </script>
</body>
</html>
