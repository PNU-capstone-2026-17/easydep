apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-chatbot
  labels:
    app: langgraph-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-chatbot
  template:
    metadata:
      labels:
        app: langgraph-chatbot
    spec:
      containers:
        - name: chatbot
          image: langgraph-chatbot:local
          ports:
            - containerPort: 8000
          # API_KEY / BASE_URL / MODEL 을 시크릿에서 환경변수로 주입
          envFrom:
            - secretRef:
                name: nim-secret
          # PyTorch + the 417MiB BERT checkpoint take about 750MiB RSS after the
          # full API has been imported. Cold CPU startup can take around a minute,
          # so keep liveness disabled until model warmup has completed.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
