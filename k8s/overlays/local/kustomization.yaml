apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# 로컬(minikube)에서는 minikube image load로 올린 로컬 이미지를 사용
images:
  - name: langgraph-chatbot
    newTag: local

# minikube 로컬 이미지는 레지스트리에서 pull하지 않도록 IfNotPresent 유지
patches:
  - target:
      kind: Deployment
      name: langgraph-chatbot
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Service를 NodePort로 노출
  - target:
      kind: Service
      name: langgraph-chatbot
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
