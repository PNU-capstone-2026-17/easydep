apiVersion: core.cnrm.cloud.google.com/v1alpha1
kind: ServiceMapping
metadata:
  name: compute.cnrm.cloud.google.com
spec:
  name: Compute
  resources:
  - name: google_compute_instance
    kind: ComputeInstance
    resourceReferences:
    - key: networkRef
      tfField: network_interface.network
      gvk:
        kind: ComputeNetwork
        version: v1beta1
        group: compute.cnrm.cloud.google.com
      targetField: self_link
    - key: subnetworkRef
      tfField: network_interface.subnetwork
      gvk:
        kind: ComputeSubnetwork
        version: v1beta1
        group: compute.cnrm.cloud.google.com
      targetField: self_link
  - name: google_compute_synthetic_thing
    kind: ComputeSyntheticThing
    resourceReferences:
    - key: attachedRef
      tfField: attached.source
      gvk:
        kind: ComputeDisk
        version: v1beta1
        group: compute.cnrm.cloud.google.com
      targetField: self_link
