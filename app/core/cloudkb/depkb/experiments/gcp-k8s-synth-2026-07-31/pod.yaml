# PVC 바인딩 트리거용 최소 Pod — registry.k8s.io(dockerhub 속도 제한 회피).
apiVersion: v1
kind: Pod
metadata:
  name: depkb-synth-pod
  labels:
    app: depkb-synth
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: depkb-synth-pvc
