# WaitForFirstConsumer 트리거용 최소 Pod.
apiVersion: v1
kind: Pod
metadata:
  name: depkb-ekspvc2-pod
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: depkb-ekspvc2
