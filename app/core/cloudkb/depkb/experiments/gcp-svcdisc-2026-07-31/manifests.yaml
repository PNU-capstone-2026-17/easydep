# 서비스 디스커버리 관측자 — **애플리케이션이 아니라 관측자다.**
# agnhost는 k8s 프로젝트의 공식 테스트 이미지이고 netexec 모드가 HTTP로
# 응답한다. 우리 워크로드가 아니라 "이름으로 찾아지는가"를 드러내는 최소
# 도구로만 쓴다(판정 note에 그렇게 적는다).
apiVersion: v1
kind: Pod
metadata:
  name: depkb-backend
  labels:
    app: depkb-backend
spec:
  containers:
    - name: netexec
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: depkb-svc
spec:
  selector:
    app: depkb-backend
  ports:
    - port: 80
      targetPort: 8080
---
# 질의자 — 클러스터 안에서 이름으로 백엔드를 찾는다.
apiVersion: v1
kind: Pod
metadata:
  name: depkb-client
spec:
  containers:
    - name: netexec
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      args: ["netexec", "--http-port=8080"]
