[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "nim-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.14.4",
    "httpx>=0.28",
    "jsonschema>=4.23",
    # 읽기 경로 전용. jsonschema(순수 파이썬)가 세션 첫 로드의 94~96%를 먹었다
    # (costkb 28.8초 · perfkb 48.6초). 스키마를 코드로 컴파일해 18배 빠르다.
    # 망가뜨린 입력 10가지에서 두 검증기의 판정이 전부 일치하는 것을 확인했다.
    "fastjsonschema>=2.19",
    # 산출물 읽기 전용. 표준 json은 순수 파이썬이라 28MB에 1.9초가 든다(실측).
    # orjson은 0.58초. 검증기와 달리 판정이 갈릴 여지가 없어 위험이 낮다.
    "orjson>=3.10",
    "openai-agents>=0.18.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
    # 벤더 스키마의 정규식은 .NET/PCRE 문법이라 파이썬 `re`가 205건을 못 읽는다
    # (`\p{L}` 계열 194건). 번역하지 않고 그 문법을 아는 엔진으로 읽는다 —
    # `\p{L}`을 `[^\W\d_]`로 옮기는 건 근사치라 검증이 엄격해지면 fail-closed가 된다.
    "regex>=2024.5.15",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.28",
]
costkb = [
    "pgdumplib>=4",
]
# perfkb도 같은 덤프를 읽는다(같은 행의 details 컬럼). 의존성이 겹치지만 각 패키지의
# 빌드를 각자 이름으로 설치할 수 있게 별도 extra로 둔다.
perfkb = [
    "pgdumplib>=4",
]
# build-aws-waf(로컬 전용) 전용 — 코퍼스를 읽기만 하는 환경에는 필요 없다.
patternkb = [
    "pypdf>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
