[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "nim-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.14.4",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "openai-agents>=0.18.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.28",
]
costkb = [
    "pgdumplib>=4",
]
# perfkb도 같은 덤프를 읽는다(같은 행의 details 컬럼). 의존성이 겹치지만 각 패키지의
# 빌드를 각자 이름으로 설치할 수 있게 별도 extra로 둔다.
perfkb = [
    "pgdumplib>=4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
