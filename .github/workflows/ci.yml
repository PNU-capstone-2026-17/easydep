name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff==0.16.0

      # depkb/experiments는 실측 기록이며 제품 코드 품질 검사 대상이 아니다.
      - name: Lint maintained code
        run: ruff check app/requirements app/core/orchestration evaluation/baselines tests

      # 레거시 cloudkb 테스트와 분리된 현재 통합 테스트만 실행한다.
      - name: Test
        run: pytest tests
