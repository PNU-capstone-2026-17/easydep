[pytest]
# 배포 에이전트는 자기 테스트를 자기 디렉터리에 갖고 왔다. 그 테스트들이
# ROOT = parent.parent 로 app/deployment/ 를 잡아 data/·NOTICE·appkb/examples 를
# 찾으므로 옮기지 않는다. conftest 도 각자 디렉터리에 있어 서로 번지지 않는다.
testpaths = tests app/deployment/tests
# 두 묶음에 test_cli.py 가 하나씩 있다. 기본 import 모드는 같은 basename 을
# sys.modules 한 자리에 넣으려다 충돌하므로, 파일 경로로 구분하는 importlib 로 쓴다.
addopts = -q --import-mode=importlib
markers =
    live: 실제 NIM 엔드포인트를 호출하는 통합 테스트 (RUN_LIVE_TESTS=1 로 옵트인)
