[pytest]
# 배포 에이전트는 자기 테스트를 자기 디렉터리에 갖고 왔다. 그 테스트들이
# Cloud KB 검사는 저장소 공용 tests/에 있으며 package 내부에는 별도 test tree가 없다.
testpaths = tests
addopts = -q
markers =
    e2e: 실제 브라우저를 실행하는 프론트엔드 종단 테스트 (RUN_E2E_TESTS=1 로 옵트인)
    live: 실제 NIM 엔드포인트를 호출하는 통합 테스트 (RUN_LIVE_TESTS=1 로 옵트인)
    timeout(seconds): 종료 보장을 확인하는 테스트의 최대 실행시간 표식
